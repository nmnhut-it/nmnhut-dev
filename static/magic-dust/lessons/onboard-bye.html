<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onboard-bye harness — BYE</title>
<!-- Dev harness for the farewell flow, mirrors onboard.html: always
     replayable, nothing to clear between runs.
     Open: http://localhost:8123/lessons/onboard-bye.html -->
<link rel="stylesheet" href="saga.css">
<script defer src="theme.js"></script>
<script defer src="onboard-bye.js" data-manual></script>
<style>
  /* hover-to-reveal (2026-07-30, owner: "should only show when hovered") —
     a thin sliver pokes up from the bottom-right edge as the hover target;
     the full bar slides up on hover/focus so it never sits in the way of a
     screenshot/demo of the actual scene. */
  #obbdevbar{position:fixed;right:12px;bottom:0;z-index:99;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
            background:#183f49cc;border:1px solid #183f49;border-radius:12px 12px 0 0;padding:8px 10px;font:12px/1.4 system-ui;
            transform:translateY(calc(100% - 6px));transition:transform .2s ease}
  #obbdevbar:hover,#obbdevbar:focus-within{transform:translateY(0)}
  #obbdevbar button{background:#183f49;border:1px solid #183f49;color:#d9eee5;border-radius:8px;padding:5px 10px;cursor:pointer}
  #obbdevbar button:hover{border-color:var(--c,#78b2a5);color:var(--c,#78b2a5)}
</style>
</head>
<body>
<div id="obbdevbar">
  <button id="dv-replay">↻ replay</button>
  <button id="dv-five">✋ five (skip hold)</button>
  <button id="dv-preview">🎬 preview spirit (free, no API)</button>
  <button id="dv-skip">⏭ skip scene</button>
</div>
<script>
  let inst = null;
  const start = () => { inst && inst.destroy(); inst = OnboardBye.mount({ onDone: () => { inst = null; } }); };
  addEventListener('DOMContentLoaded', () => {
    start();
    const $ = id => document.getElementById(id);
    $('dv-replay').onclick = start;
    $('dv-five').onclick = () => obDevBye.trigger();
    $('dv-preview').onclick = () => obDevBye.previewSpirit();
    $('dv-skip').onclick = () => obDevBye.act(1);
  });
</script>
</body>
</html>
