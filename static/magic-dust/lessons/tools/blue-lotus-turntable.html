<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html,body{margin:0;width:512px;height:512px;overflow:hidden;background:transparent}
    canvas{display:block;width:512px;height:512px}
  </style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, premultipliedAlpha:false });
renderer.setSize(512,512);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.setClearColor(0x000000,0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(31,1,.1,100);
camera.position.set(0,2.45,8.6);
camera.lookAt(0,.7,0);

scene.add(new THREE.AmbientLight(0x071b52,1.5));
const key = new THREE.PointLight(0x50dfff,34,18); key.position.set(-3,5,5); scene.add(key);
const rim = new THREE.PointLight(0x264cff,38,16); rim.position.set(4,2,-4); scene.add(rim);
const coreLight = new THREE.PointLight(0x71f6ff,42,8); coreLight.position.set(0,.8,0); scene.add(coreLight);

const lotus = new THREE.Group();
lotus.rotation.x = -.08;
scene.add(lotus);

function petalGeometry(){
  const g = new THREE.PlaneGeometry(1.46,2.25,24,32);
  const pos=g.attributes.position,uv=g.attributes.uv;
  for(let i=0;i<g.attributes.position.count;i++){
    const u=uv.getX(i),v=uv.getY(i);
    const envelope=.055+.945*Math.pow(Math.sin(Math.PI*v),.38);
    pos.setX(i,(u-.5)*1.46*envelope);
    pos.setY(i,v*2.25);
    const belly=(1-Math.pow(u*2-1,2))*Math.sin(Math.PI*v)*.29;
    const curledTip=Math.pow(v,3)*.34;
    const curledEdges=-Math.pow(Math.abs(u-.5)*2,2)*Math.sin(Math.PI*v)*.1;
    pos.setZ(i,belly+curledTip+curledEdges);
  }
  pos.needsUpdate=true;
  g.computeVertexNormals();
  return g;
}
const petal = petalGeometry();
function petalTexture(){
  const c=document.createElement("canvas"); c.width=512;c.height=1024;
  const x=c.getContext("2d");
  x.clearRect(0,0,512,1024);
  x.save();x.beginPath();x.moveTo(242,30);x.quadraticCurveTo(256,8,270,30);
  x.bezierCurveTo(342,92,450,370,442,690);
  x.bezierCurveTo(438,850,340,982,256,1018);
  x.bezierCurveTo(172,982,74,850,70,690);
  x.bezierCurveTo(74,850,172,982,256,1018);
  x.bezierCurveTo(62,360,170,92,242,30);x.closePath();x.clip();
  const bg=x.createLinearGradient(0,1024,0,0);
  bg.addColorStop(0,"#020a4d");bg.addColorStop(.28,"#042fae");bg.addColorStop(.68,"#078ee8");bg.addColorStop(1,"#55f4ff");
  x.fillStyle=bg;x.fillRect(0,0,512,1024);
  const glow=x.createRadialGradient(256,850,12,256,730,430);
  glow.addColorStop(0,"rgba(199,255,255,.95)");glow.addColorStop(.18,"rgba(25,226,255,.48)");glow.addColorStop(1,"rgba(0,28,154,0)");
  x.fillStyle=glow;x.fillRect(0,0,512,1024);
  x.globalCompositeOperation="screen";
  for(let i=0;i<54;i++){
    const side=i%2?1:-1,spread=24+(i%9)*22,startX=256+(i%5-2)*7;
    x.beginPath();x.moveTo(startX,960);
    x.bezierCurveTo(256+side*spread*.18,720-i*5,256+side*spread*.72,430-i*3,256+side*spread,80+(i%7)*38);
    x.strokeStyle=`rgba(${80+i%4*35},${185+i%3*22},255,${.07+(i%6)*.018})`;
    x.lineWidth=.8+(i%5)*.48;x.stroke();
  }
  for(let i=0;i<240;i++){
    const px=(i*197)%512,py=(i*431)%1024,r=.5+(i%5)*.42;
    x.fillStyle=`rgba(120,235,255,${.08+(i%4)*.025})`;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();
  }
  x.restore();
  const texture=new THREE.CanvasTexture(c);texture.colorSpace=THREE.SRGBColorSpace;
  texture.wrapS=texture.wrapT=THREE.ClampToEdgeWrapping;
  texture.anisotropy=8;
  return texture;
}
const energyTexture=petalTexture();
function material(color,emissive,transmission){
  return new THREE.MeshPhysicalMaterial({
    color, map:energyTexture, emissive, emissiveMap:energyTexture, emissiveIntensity:1.15,
    metalness:.02, roughness:.22, transmission, thickness:1.15, ior:1.4,
    transparent:true, opacity:.97, alphaTest:.025, clearcoat:1, clearcoatRoughness:.06,
    bumpMap:energyTexture,bumpScale:.035,side:THREE.DoubleSide,depthWrite:true,
  });
}
const mats=[
  material(0x164ee8,0x00175e,.28),
  material(0x149fe9,0x003d91,.34),
  material(0x5ceeff,0x027b9d,.4),
];
function ring(count,radius,scale,height,tilt,matIndex,offset=0){
  for(let i=0;i<count;i++){
    const a=offset+i/count*Math.PI*2;
    const mesh=new THREE.Mesh(petal,mats[matIndex]);
    mesh.scale.set(scale*(.94+Math.sin(i*4.17)*.05),scale,scale);
    mesh.position.set(Math.sin(a)*radius,height,Math.cos(a)*radius);
    mesh.rotation.order="YXZ";
    mesh.rotation.y=a;
    mesh.rotation.x=tilt;
    lotus.add(mesh);
  }
}
ring(12,.82,.72,-.48,.68,0,Math.PI/12);
ring(9,.56,.78,-.24,.43,1,0);
ring(7,.31,.66,.02,.19,2,Math.PI/7);
ring(5,.12,.48,.23,.02,2,0);

const coreMat=new THREE.MeshPhysicalMaterial({
  color:0x9ffaff,emissive:0x24dfff,emissiveIntensity:3.2,roughness:.12,
  transmission:.62,thickness:1.4,ior:1.32,transparent:true,opacity:.96,
});
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.48,3),coreMat);
core.position.y=.63; core.scale.set(.72,1.35,.72); lotus.add(core);

const baseMat=material(0x0630a8,0x001a61,.38);
const base=new THREE.Mesh(new THREE.SphereGeometry(.76,48,24,0,Math.PI*2,0,Math.PI/2),baseMat);
base.scale.set(1,.45,1); base.position.y=-.52; lotus.add(base);

const frame=Number(new URLSearchParams(location.search).get("frame")||0)%16;
lotus.rotation.y=frame/16*Math.PI*2;
renderer.render(scene,camera);
document.body.dataset.ready="true";
</script>
</body>
</html>
