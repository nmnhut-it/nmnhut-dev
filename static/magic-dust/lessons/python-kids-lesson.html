</head><body><script type="module">
import { PYTHON_KIDS_NODES } from "./content/python-kids-curriculum.js";
const id = Number.parseInt(new URLSearchParams(location.search).get("node"), 10);
const mainProgress = Math.max(0, Number.parseInt(localStorage.getItem("magicdust.saga"), 10) || 0);
const previousDone = id === 0 || localStorage.getItem(`magicdust.pythonKids.node.${id - 1}`) === "1";
if (!PYTHON_KIDS_NODES[id] || mainProgress < 0 || !previousDone) location.replace("./python-kids.html");
else { const { default: lesson } = await import(`./content/python-kidsnode${String(id).padStart(2, "0")}.js`); window.NODE = lesson; await import("./island.js"); }
</script></body></html>
